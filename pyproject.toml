[project]
name = "agentflow"
version = "0.1.0"
description = "Multi-agent dev workflow orchestrator: goal -> review -> plan -> build -> test -> verify/iterate -> push"
authors = [
    { name = "elawrenceponce", email = "elawrenceponce@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-antigravity>=0.1.13",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "rich>=13",
    "prompt_toolkit>=3",
    "mcp>=2.0.0",
]

[project.scripts]
agentflow = "agentflow:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]
