# Copy to agentflow.config.yaml (gitignored) and adjust per role.
# Each role can independently use: claude-code | antigravity | openrouter
# Env var overrides win over this file: AGENTFLOW_<ROLE>_BACKEND / AGENTFLOW_<ROLE>_MODEL

# Cost-effective, high-intelligence setup using OpenRouter (requires OPENROUTER_API_KEY):
review:
  backend: openrouter
  model: deepseek/deepseek-chat  # Alternative: google/gemini-2.0-flash-001

build:
  backend: openrouter
  model: deepseek/deepseek-chat  # Alternative: qwen/qwen-2.5-coder-32b-instruct

verify:
  backend: openrouter
  model: deepseek/deepseek-chat  # Alternative: google/gemini-2.0-flash-001

max_iterations: 3

