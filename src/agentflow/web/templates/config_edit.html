{% extends "base.html" %}
{% block title %}agentflow — Config{% endblock %}
{% block content %}
  <h1>Backend config</h1>

  {% if saved %}<div class="banner banner-ok">Saved.</div>{% endif %}

  <form method="post" action="/config">
    {% for role, role_config in [("review", config.review), ("build", config.build), ("verify", config.verify)] %}
      <fieldset>
        <legend>{{ role }}</legend>
        <label>
          Backend
          <select name="{{ role }}_backend">
            {% for name in backend_names %}
              <option value="{{ name }}" {% if role_config.backend == name %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Model (optional)
          <input type="text" name="{{ role }}_model" value="{{ role_config.model or '' }}">
        </label>
      </fieldset>
    {% endfor %}

    <label>
      Max iterations
      <input type="number" name="max_iterations" min="1" value="{{ config.max_iterations }}">
    </label>

    <button type="submit">Save</button>
  </form>
{% endblock %}
