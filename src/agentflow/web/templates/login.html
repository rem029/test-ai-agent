<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · agentflow</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <h1>agentflow</h1>
      <p>Sign in to your local agent console</p>
    </div>

    {% if error %}
      <div class="alert error" role="alert">{{ error }}</div>
    {% endif %}
    <div class="alert error hidden" id="client-error" role="alert"></div>

    <form method="post" action="/login" class="auth-form" id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <p class="auth-hint">Demo credentials: <code>admin / admin123</code></p>
  </main>

  <script>
    (function () {
      const form = document.getElementById('login-form');
      const clientError = document.getElementById('client-error');
      const username = document.getElementById('username');
      const password = document.getElementById('password');

      form.addEventListener('submit', function (event) {
        let message = '';
        if (!username.value.trim()) {
          message = 'Username is required.';
        } else if (!password.value) {
          message = 'Password is required.';
        }

        if (message) {
          event.preventDefault();
          clientError.textContent = message;
          clientError.classList.remove('hidden');
        }
      });
    })();
  </script>
</body>
</html>
